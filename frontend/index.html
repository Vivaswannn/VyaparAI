<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VyaparAI - Financial Copilot</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FAFAFA; color: #111827; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }
    </style>
</head>
<body class="antialiased min-h-screen">

    <div class="max-w-6xl mx-auto p-4 md:p-8 flex flex-col md:flex-row gap-8 min-h-screen items-stretch">
        
        <!-- LEFT PANEL: Upload & Documents -->
        <div class="w-full md:w-1/3 flex flex-col gap-6">
            
            <!-- Header -->
            <div class="flex items-center justify-between pb-4 border-b border-gray-200">
                <h1 class="text-xl font-semibold tracking-tight text-gray-900 flex items-center gap-2">
                    <span class="material-icons text-gray-900">layers</span> VyaparAI
                </h1>
                <div class="flex items-center gap-2">
                    <select id="profileSelector" class="text-xs border border-gray-200 bg-white text-gray-700 py-1.5 px-2 rounded-md focus:outline-none cursor-pointer">
                        <option value="demo_user">Guest Profile</option>
                        <option value="shree_ganesh">Shree Ganesh Ent.</option>
                        <option value="my_shop">My Shop Profile</option>
                    </select>
                    <button id="langToggleBtn" class="text-xs font-medium text-gray-500 hover:text-gray-900 transition-colors bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-md">
                        EN / हिन्दी
                    </button>
                </div>
            </div>

            <!-- Upload / Manual Tabs -->
            <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                <div class="flex border-b border-gray-200">
                    <button id="tabUploadBtn" class="flex-1 py-3 text-xs font-semibold bg-gray-50 text-gray-900 border-r border-gray-200">File Upload</button>
                    <button id="tabManualBtn" class="flex-1 py-3 text-xs font-semibold bg-white text-gray-500 hover:text-gray-900">Manual Entry</button>
                </div>
                
                <!-- Upload Zone -->
                <div id="uploadZone" class="group cursor-pointer p-6 hover:bg-gray-50 transition-colors block">
                    <div class="border border-dashed border-gray-300 bg-white p-6 rounded-xl text-center flex flex-col items-center justify-center gap-2 group-hover:border-gray-500 transition-all h-32">
                        <input type="file" id="fileInput" class="hidden" accept=".pdf,.png,.jpg,.jpeg">
                        <span class="material-icons text-gray-400 group-hover:text-gray-700 transition-colors">upload_file</span>
                        <p class="text-sm font-medium text-gray-700">Upload Invoice</p>
                        <p class="text-[10px] text-gray-400 uppercase tracking-widest" id="uploadStatus">PDF, JPG, PNG</p>
                    </div>
                </div>

                <!-- Manual Entry Form -->
                <div id="manualZone" class="p-6 hidden">
                    <form id="manualForm" class="flex flex-col gap-3">
                        <input type="text" id="manVendor" placeholder="Vendor Name" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-gray-500" required>
                        <div class="flex gap-3">
                            <input type="number" id="manAmount" placeholder="Amount (₹)" class="w-1/2 text-sm border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-gray-500" required>
                            <input type="date" id="manDate" class="w-1/2 text-sm border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-gray-500" required>
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-gray-900 text-white text-sm font-medium rounded-lg hover:bg-black transition-colors">Save Record</button>
                    </form>
                </div>
            </div>

            <button id="exportBtn" class="w-full py-2.5 bg-white border border-gray-200 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50 hover:text-gray-900 transition-all shadow-sm flex items-center justify-center gap-2">
                <span class="material-icons text-[16px]">download</span> Export Ledger
            </button>

            <!-- Document List -->
            <div class="mt-4 flex-1 flex flex-col min-h-0">
                <h3 class="text-[10px] font-semibold mb-3 uppercase tracking-widest text-gray-400">Ledger Entries</h3>
                <div id="docList" class="flex flex-col gap-2 overflow-y-auto pr-2 pb-4">
                    <div class="animate-pulse flex space-x-4 p-3 bg-white border border-gray-100 rounded-lg">
                        <div class="rounded-md bg-gray-200 h-8 w-8"></div>
                        <div class="flex-1 space-y-2 py-1">
                            <div class="h-2 bg-gray-200 rounded w-3/4"></div>
                            <div class="h-2 bg-gray-200 rounded w-1/2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Chat Interface -->
        <div class="w-full md:w-2/3 bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col h-[calc(100vh-4rem)]">
            
            <!-- Chat Header -->
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-white rounded-t-2xl">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-md bg-gray-100 flex items-center justify-center border border-gray-200">
                        <span class="material-icons text-gray-700 text-[18px]">bolt</span>
                    </div>
                    <div>
                        <h2 class="text-sm font-semibold text-gray-900">Financial Copilot</h2>
                        <p class="text-[10px] text-green-600 font-medium flex items-center gap-1">Online</p>
                    </div>
                </div>
                <span id="voiceStatus" class="text-[10px] uppercase tracking-wider font-medium text-gray-400">Mic Ready</span>
            </div>
            
            <!-- Chat History -->
            <div id="chatHistory" class="flex-1 p-6 flex flex-col gap-4 overflow-y-auto bg-[#FCFCFC]">
                <div class="self-start bg-white border border-gray-200 p-4 rounded-xl rounded-tl-sm max-w-[85%] text-sm text-gray-600 leading-relaxed shadow-sm">
                    Welcome to VyaparAI. Upload your financial documents, and ask me to generate summaries, calculate GST input credit, or draft MSME reminder letters.
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 bg-white border-t border-gray-100 rounded-b-2xl">
                <form id="chatForm" class="flex items-center gap-3">
                    
                    <button type="button" id="micBtn" class="w-10 h-10 bg-gray-50 text-gray-500 rounded-full hover:bg-gray-100 hover:text-gray-900 transition-colors flex items-center justify-center flex-shrink-0 border border-gray-200" title="Voice Typing">
                        <span class="material-icons text-[18px]" id="micIcon">mic</span>
                    </button>
                    
                    <input type="text" id="queryInput" class="flex-1 bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-xl py-3 px-4 focus:outline-none focus:border-gray-400 focus:bg-white transition-all placeholder:text-gray-400" placeholder="Ask about payments, GST..." required>
                    
                    <button type="submit" id="sendBtn" class="w-10 h-10 bg-gray-900 text-white rounded-xl hover:bg-black transition-colors flex items-center justify-center shadow-sm disabled:opacity-50">
                        <span class="material-icons text-[16px]" id="sendIcon">arrow_upward</span>
                    </button>

                </form>
            </div>
        </div>
    </div>

<script>
    let isHindi = false;
    let isRecording = false;

    // Multi-tenant Mock User Session
    let currentUser = localStorage.getItem('vyapar_user') || 'demo_user';
    const profileSelector = document.getElementById('profileSelector');
    if (profileSelector) {
        profileSelector.value = currentUser;
        profileSelector.addEventListener('change', (e) => {
            currentUser = e.target.value;
            localStorage.setItem('vyapar_user', currentUser);
            fetchDocuments();
            addMessage('system', 'Switched Profile: ' + currentUser);
        });
    }

    const langToggleBtn = document.getElementById('langToggleBtn');
    const uploadZone = document.getElementById('uploadZone');
    const manualZone = document.getElementById('manualZone');
    const tabUploadBtn = document.getElementById('tabUploadBtn');
    const tabManualBtn = document.getElementById('tabManualBtn');
    const manualForm = document.getElementById('manualForm');
    const fileInput = document.getElementById('fileInput');
    const uploadStatus = document.getElementById('uploadStatus');
    const exportBtn = document.getElementById('exportBtn');
    const docList = document.getElementById('docList');
    
    const chatHistory = document.getElementById('chatHistory');
    const chatForm = document.getElementById('chatForm');
    const queryInput = document.getElementById('queryInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const voiceStatus = document.getElementById('voiceStatus');

    // Tabs
    tabUploadBtn.addEventListener('click', () => {
        uploadZone.classList.remove('hidden'); manualZone.classList.add('hidden');
        tabUploadBtn.className = 'flex-1 py-3 text-xs font-semibold bg-gray-50 text-gray-900 border-r border-gray-200';
        tabManualBtn.className = 'flex-1 py-3 text-xs font-semibold bg-white text-gray-500 hover:text-gray-900';
    });
    tabManualBtn.addEventListener('click', () => {
        uploadZone.classList.add('hidden'); manualZone.classList.remove('hidden');
        tabManualBtn.className = 'flex-1 py-3 text-xs font-semibold bg-gray-50 text-gray-900 border-l border-gray-200';
        tabUploadBtn.className = 'flex-1 py-3 text-xs font-semibold bg-white text-gray-500 hover:text-gray-900';
    });

    // Manual Form Submit
    manualForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            vendor: document.getElementById('manVendor').value,
            amount: parseFloat(document.getElementById('manAmount').value),
            due_date: document.getElementById('manDate').value
        };
        try {
            const res = await fetch('/api/manual', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-User-Id': currentUser },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                manualForm.reset();
                fetchDocuments();
                addMessage('system', 'Manual record saved.');
            }
        } catch(err) { console.error(err); }
    });

    // Toggle Language
    langToggleBtn.addEventListener('click', () => {
        isHindi = !isHindi;
        langToggleBtn.textContent = isHindi ? '🌐 हिन्दी' : '🌐 EN';
        queryInput.placeholder = isHindi ? 'भुगतान, बकाया बिल, जीएसटी के बारे में पूछें...' : 'Ask about payments, GST...';
        addMessage('system', isHindi ? 'हिंदी भाषा सक्रिय है।' : 'Switched to English context.');
    });

    // Upload Document
    uploadZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
        if (e.target.files.length === 0) return;
        const file = e.target.files[0];
        
        const formData = new FormData();
        formData.append('file', file);
        
        uploadStatus.textContent = 'Uploading...';
        uploadStatus.classList.add('text-gray-900');

        try {
            const res = await fetch('/api/upload', { 
                method: 'POST', 
                headers: { 'X-User-Id': currentUser }, 
                body: formData 
            });
            const data = await res.json();
            if (res.ok && data.status === 'success') {
                uploadStatus.textContent = 'Success!';
                fetchDocuments(); 
            } else {
                throw new Error(data.message || 'Upload failed');
            }
        } catch (err) {
            uploadStatus.textContent = 'Error';
            uploadStatus.classList.add('text-red-500');
        }
        setTimeout(() => {
            uploadStatus.textContent = 'PDF, JPG, PNG';
            uploadStatus.className = 'text-[10px] text-gray-400 uppercase tracking-widest';
            fileInput.value = '';
        }, 3000);
    });

    // Export Ledger
    exportBtn.addEventListener('click', () => {
        window.location.href = '/api/export?user_id=' + currentUser;
    });

    // Actions
    window.deleteDoc = async (id) => {
        if(!confirm("Delete this record?")) return;
        await fetch('/api/documents/' + id, { method: 'DELETE', headers: { 'X-User-Id': currentUser }});
        fetchDocuments();
    };
    window.completeDoc = async (id) => {
        await fetch('/api/documents/' + id + '/complete', { method: 'PATCH', headers: { 'X-User-Id': currentUser }});
        fetchDocuments();
    };

    // Fetch Documents
    async function fetchDocuments() {
        try {
            const res = await fetch('/api/documents', { headers: { 'X-User-Id': currentUser } });
            if (res.ok) {
                const docs = await res.json();
                docList.innerHTML = '';
                if (docs.length === 0) {
                    docList.innerHTML = '<p class="text-xs text-gray-400 py-2">No records found.</p>';
                }
                docs.forEach(doc => {
                    const isCompleted = doc.status === 'Completed';
                    const el = document.createElement('div');
                    el.className = 'flex flex-col gap-2 p-3 bg-white border border-gray-200 rounded-lg hover:border-gray-300 transition-colors group shadow-sm ' + (isCompleted ? 'opacity-60' : '');
                    el.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div class="truncate flex-1 min-w-0">
                                <p class="font-medium text-gray-900 text-[13px] truncate ${isCompleted ? 'line-through' : ''}" title="${doc.filename}">${doc.filename}</p>
                                <p class="text-[11px] text-gray-500 mt-0.5 truncate font-medium">₹${doc.amount} <span class="text-gray-300 mx-1">|</span> ${doc.vendor}</p>
                            </div>
                            <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="completeDoc('${doc.id}')" title="Mark Paid" class="p-1 text-green-600 hover:bg-green-50 rounded"><span class="material-icons text-[14px]">check_circle</span></button>
                                <button onclick="deleteDoc('${doc.id}')" title="Delete" class="p-1 text-red-600 hover:bg-red-50 rounded"><span class="material-icons text-[14px]">delete</span></button>
                            </div>
                        </div>
                        <button onclick="generateReminder('${doc.id}')" class="w-full py-1.5 mt-1 bg-gray-50 border border-gray-200 text-gray-600 rounded-md hover:bg-gray-100 hover:text-gray-900 transition-colors text-[10px] font-semibold tracking-wide uppercase opacity-0 group-hover:opacity-100">
                            ${isHindi ? 'तगादा ड्राफ्ट करें' : 'Draft Demand Notice'}
                        </button>
                    `;
                    docList.appendChild(el);
                });
            }
        } catch (e) {
            console.error(e);
        }
    }

    // Generate Reminder
    window.generateReminder = async (docId) => {
        addMessage('user', isHindi ? 'इस बिल के लिए कानूनी रिमाइंडर लेटर बनाओ।' : 'Draft a statutory MSME reminder letter for this invoice.');
        try {
            const res = await fetch('/api/reminder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-User-Id': currentUser },
                body: JSON.stringify({ document_id: docId, language: isHindi ? 'hindi' : 'english' })
            });
            if (res.ok) {
                const data = await res.json();
                addMessage('bot', `<pre style="white-space: pre-wrap; font-family: inherit; font-size: 12px;" class="bg-gray-50 p-4 rounded-lg border border-gray-100 mt-2 text-gray-700">${data.letter}</pre>`);
                speakText(isHindi ? 'रिमाइंडर लेटर तैयार है।' : 'Statutory reminder letter drafted.');
            }
        } catch (e) {
            addMessage('system', 'Error generating draft.');
        }
    };

    // Chat Interface
    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = queryInput.value.trim();
        if (!text) return;

        addMessage('user', text);
        queryInput.value = '';
        
        sendBtn.disabled = true;
        document.getElementById('sendIcon').textContent = 'hourglass_empty';
        document.getElementById('sendIcon').classList.add('animate-spin');

        try {
            const res = await fetch('/api/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-User-Id': currentUser },
                body: JSON.stringify({ query: text, language: isHindi ? 'hindi' : 'english' })
            });
            if (res.ok) {
                const data = await res.json();
                const reply = data.summary || data.answer || JSON.stringify(data);
                addMessage('bot', reply);
                speakText(reply);
            } else {
                addMessage('system', 'Copilot offline.');
            }
        } catch (e) {
            addMessage('system', 'Network error.');
        } finally {
            sendBtn.disabled = false;
            document.getElementById('sendIcon').textContent = 'arrow_upward';
            document.getElementById('sendIcon').classList.remove('animate-spin');
        }
    });

    function addMessage(sender, htmlContent) {
        const div = document.createElement('div');
        
        if (sender === 'user') {
            div.className = 'self-end bg-gray-900 text-white p-3 px-4 rounded-2xl rounded-tr-sm max-w-[85%] text-[13px] shadow-sm leading-relaxed';
        } else if (sender === 'system') {
            div.className = 'self-center bg-gray-100 text-gray-500 text-[10px] uppercase tracking-wider rounded-md px-3 py-1 font-semibold';
        } else {
            div.className = 'self-start bg-white border border-gray-200 p-4 rounded-2xl rounded-tl-sm max-w-[85%] text-[13px] text-gray-700 leading-relaxed shadow-sm';
        }
        
        div.innerHTML = htmlContent;
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    // Voice & TTS
    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text.replace(/<[^>]*>?/gm, ''));
        utterance.lang = isHindi ? 'hi-IN' : 'en-IN';
        window.speechSynthesis.speak(utterance);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let finalTranscript = '';

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onstart = () => {
            isRecording = true;
            finalTranscript = '';
            queryInput.value = '';
            micBtn.classList.replace('text-gray-500', 'text-red-500');
            micBtn.classList.add('bg-red-50', 'border-red-100', 'animate-pulse');
            voiceStatus.textContent = 'Listening...';
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            queryInput.value = finalTranscript + interimTranscript;
        };

        recognition.onend = () => {
            isRecording = false;
            micBtn.classList.replace('text-red-500', 'text-gray-500');
            micBtn.classList.remove('bg-red-50', 'border-red-100', 'animate-pulse');
            voiceStatus.textContent = 'Mic Ready';
        };

        recognition.onerror = () => recognition.stop();

        micBtn.addEventListener('click', () => {
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.lang = isHindi ? 'hi-IN' : 'en-IN';
                recognition.start();
            }
        });
    } else {
        micBtn.style.display = 'none';
        voiceStatus.textContent = 'Voice Unavailable';
    }

    // Init
    fetchDocuments();

</script>
</body>
</html>
